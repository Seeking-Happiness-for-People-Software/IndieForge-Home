name: 编译并发布(APP + 固件)

# 手动触发:填版本号(如 v1.1.0),可选指定两个仓库的分支/标签。
# 产物:1) 编入 GitHub Pages 的下载页  2) 挂到 IndieForge-Home Release
# 版本注入:版本号只写进构建产物(APK --build-name / 固件 version.txt),不回写任何仓库;
# 构建号(build-number)用 GitHub run_number 自动生成。
# OTA:Release 附带 app-only 镜像 IndieForge-Passport-app.bin,App 经 BLE 推送给设备
# (设备写 ota 槽后重启);整包 full.bin 仍用于串口有线刷写。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号(如 v1.1.0)"
        required: true
        default: "v0.1.0"
      app_ref:
        description: "IndieForge-APP 分支/标签"
        required: true
        default: "main"
      fw_ref:
        description: "IndieForge-Passport 分支/标签"
        required: true
        default: "feature/indieforge-passport"
      prerelease:
        description: "预发行版(不勾选则为正式版并标记为 latest)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: indieforge-release
  cancel-in-progress: false

jobs:
  build-app:
    name: 编译 Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出 APP 私有仓库
        uses: actions/checkout@v4
        with:
          repository: Seeking-Happiness-for-People-Software/IndieForge-APP
          ref: ${{ inputs.app_ref }}
          token: ${{ secrets.PASSPORT_GH_TOKEN }}

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 构建 release APK(注入版本号)
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          # 版本号去 v 前缀注入 --build-name,构建号用 run_number(不回写仓库)
          BUILD_NAME="${RAW_VERSION#v}"
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-firmware:
    name: 编译设备固件
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - name: 检出固件私有仓库
        uses: actions/checkout@v4
        with:
          repository: Seeking-Happiness-for-People-Software/IndieForge-Passport
          ref: ${{ inputs.fw_ref }}
          token: ${{ secrets.PASSPORT_GH_TOKEN }}

      - name: 构建并合并整包固件
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # 版本号去 v 前缀写入 version.txt(esp_app_desc.version + APP_FW_VERSION 宏同源)
          RAW_VERSION="${{ inputs.version }}"
          echo "${RAW_VERSION#v}" > version.txt
          idf.py build
          # merge-bin 生成 bootloader+分区表+otadata+app 的整包(5.5 产物名 merged-binary.bin),
          # 可直接 write_flash 0x0
          idf.py merge-bin
          ls -l build/merged-binary.bin
          cp build/merged-binary.bin IndieForge-Passport-full.bin
          # app-only 镜像(裸应用镜像,esp OTA 用;整包不能走 OTA)
          cp build/FoloToy-AI-Passport.bin IndieForge-Passport-app.bin
          ls -l IndieForge-Passport-app.bin

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            IndieForge-Passport-full.bin
            IndieForge-Passport-app.bin
          if-no-files-found: error

  publish-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [build-app, build-firmware]
    steps:
      - name: 检出站点仓库
        uses: actions/checkout@v4

      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理下载区
        run: |
          mkdir -p site/downloads
          cp artifacts/app-apk/app-release.apk site/downloads/IndieForge-APP.apk
          cp artifacts/firmware-bin/IndieForge-Passport-full.bin site/downloads/IndieForge-Passport-full.bin
          cp artifacts/firmware-bin/IndieForge-Passport-app.bin site/downloads/IndieForge-Passport-app.bin
          cp -r index.html site/
          ls -lR site

      - name: 创建 GitHub Release(APK + 整包固件 + OTA 镜像)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: IndieForge ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          # 正式版才标记为 latest;预发行版不抢 latest 位
          make_latest: ${{ !inputs.prerelease }}
          body: |
            APP 分支 `${{ inputs.app_ref }}` / 固件分支 `${{ inputs.fw_ref }}` 由 CI 自动编译。
            固件 OTA:IndieForge APP(设置 → 设备 → 固件更新)从本 Release 下载 `IndieForge-Passport-app.bin` 并经 BLE 推送,设备写入 OTA 分区后自动重启生效。
            固件有线刷写:`esptool.py --chip esp32c3 write_flash 0x0 IndieForge-Passport-full.bin`
          files: |
            site/downloads/IndieForge-APP.apk
            site/downloads/IndieForge-Passport-full.bin
            site/downloads/IndieForge-Passport-app.bin

      - name: 上传 Pages 站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: 部署 GitHub Pages
    runs-on: ubuntu-latest
    needs: publish-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
